name: Docker CI/CD

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Validate Python sources
        run: python -m compileall src

      - name: Build Docker image
        run: docker build -t exo-phc-devops:ci .

      - name: Smoke test Docker image
        run: docker run --rm --entrypoint streamlit exo-phc-devops:ci --version

      - name: Smoke test app startup
        env:
          STARTUP_TIMEOUT_SECONDS: 15
        run: |
          docker run --rm --entrypoint sh exo-phc-devops:ci -c '
            status=0
            timeout '"$STARTUP_TIMEOUT_SECONDS"' streamlit run src/Home.py --server.headless true --server.address 0.0.0.0 --server.port 8501 >/tmp/streamlit.log 2>&1 || status=$?
            # timeout returns 124 when the app keeps running after the limit.
            if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
              cat /tmp/streamlit.log
              exit "$status"
            fi
            # Ensure startup logs were produced, and print logs when they are missing.
            if ! grep -q "URL:" /tmp/streamlit.log; then
              cat /tmp/streamlit.log
              exit 1
            fi
          '

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/exo-phc-devops:latest
